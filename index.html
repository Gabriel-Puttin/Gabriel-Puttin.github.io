<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gabriel@portfolio: ~</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <canvas id="matrix-bg" aria-hidden="true"></canvas>

  <main class="terminal" id="terminal" role="application" aria-label="Terminal interativo do portfólio">
    <div id="boot-image-container"></div>
    <header class="terminal__bar">
      <div class="terminal__dots">
        <span class="dot dot--close"></span>
        <span class="dot dot--min"></span>
        <span class="dot dot--max"></span>
      </div>
      <span class="terminal__title">gabriel@portfolio: ~</span>
    </header>

    <section class="terminal__body" id="output" tabindex="-1" aria-live="polite"></section>

    <div class="terminal__input-line">
      <span class="prompt" id="prompt">gabriel@portfolio:~$</span>
      <input
        type="text"
        id="cmd-input"
        class="terminal__input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Digite um comando"
      >
    </div>
  </main>

  <div class="modal-overlay" id="project-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" id="modal-close" aria-label="Fechar">✕</button>

      <div class="modal__header">
        <p class="modal__category" id="modal-category"></p>
        <h2 class="modal__title" id="modal-title"></h2>
        <p class="modal__tech" id="modal-tech"></p>
      </div>

      <div class="modal__gallery-wrap" id="modal-gallery-wrap">
        <button class="modal__nav modal__nav--prev" id="modal-prev" aria-label="Imagem anterior">‹</button>
        <div class="modal__gallery" id="modal-gallery"></div>
        <button class="modal__nav modal__nav--next" id="modal-next" aria-label="Próxima imagem">›</button>
      </div>
      <div class="modal__progress" id="modal-progress">
        <div class="modal__progress-bar" id="modal-progress-bar"></div>
      </div>

      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
